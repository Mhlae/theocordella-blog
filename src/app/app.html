<div class="site-shell">
  <header class="site-header">
    <div class="header-leading">
      <span class="brand"><strong>Théo Cordella</strong></span>
      <a
        class="back-home"
        routerLink="/home"
        routerLinkActive="home-active"
        #homeRoute="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        [attr.aria-hidden]="homeRoute.isActive ? true : null"
        [attr.aria-label]="homeRoute.isActive ? null : copy.returnHome"
      >
        <span aria-hidden="true">←</span>{{ copy.returnHome }}
      </a>
    </div>

    <div class="header-actions">
      <div class="language-switcher" role="group" [attr.aria-label]="copy.languageLabel">
        @for (option of languageOptions; track option) {
          <button
            type="button"
            [class.active]="languageService.current() === option"
            [attr.aria-pressed]="languageService.current() === option"
            [attr.aria-label]="
              copy[option === 'pt' ? 'portuguese' : option === 'en' ? 'english' : 'spanish']
            "
            (click)="setLanguage(option)"
          >
            {{ option }}
          </button>
        }
      </div>

      <button
        class="theme-toggle"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="themeService.isDark() ? copy.lightTheme : copy.darkTheme"
      >
        <span aria-hidden="true">{{ themeService.isDark() ? '☼' : '☾' }}</span>
      </button>
    </div>
  </header>

  <router-outlet />
  <footer class="site-footer">
    <span>© 2026 THEOCORDELLA</span>
    <span>{{ copy.footer }}</span>
  </footer>
</div>
